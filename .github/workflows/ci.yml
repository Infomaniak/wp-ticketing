name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP lint & tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer

      - name: Composer install
        run: composer install --optimize-autoloader --prefer-dist

      - name: Pint
        run: composer lint:check

      - name: PHPUnit
        run: composer test

  js:
    name: JS lint, types, tests & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Enable corepack (Yarn 4)
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Yarn install
        run: yarn install --immutable

      - name: ESLint
        run: yarn lint:check

      - name: TypeScript
        run: yarn types

      - name: Vitest
        run: yarn test:run

      - name: Vite build
        run: yarn build
